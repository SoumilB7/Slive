[project]
name = "flowy"
version = "0.1.0"
description = "Slive's local backend: AI proxy, on-device LLM inference, Whisper fine-tuning"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.14"
# Base = the HTTP server and the cloud-provider proxy. Everything heavy is an
# extra and imported lazily, so the server starts without it:
#   local     on-device Hugging Face models (Assistant / Ground Truth)
#   training  Whisper fine-tuning — includes `local`; install-full uses this
#   dev       tests + lint — includes `training`
dependencies = [
  "fastapi>=0.139.0",
  "httpx>=0.27",
  "pydantic>=2.13",
  "uvicorn[standard]>=0.51.0",
]

[project.optional-dependencies]
local = [
  "accelerate>=1.10.0",
  "librosa>=0.11.0",
  "pillow>=11.3.0",
  "soundfile>=0.13.1",
  "torch>=2.8.0",
  "torchao>=0.17.0",
  "torchvision>=0.28.0",
  "transformers>=5.10.1",
]
training = [
  "flowy[local]",
  "peft>=0.18.0",
  "psutil>=7.0.0",
]
dev = [
  "flowy[training]",
  "pytest>=8.4.0",
  "ruff>=0.12.0",
]

[project.scripts]
slive-server = "flowy.server:main"
flowy-train = "flowy.training.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
